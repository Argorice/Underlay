# Gradle
org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Parchment (human-readable parameter names for Minecraft sources)
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Environment
minecraft_version=1.21.1
minecraft_version_range=[1.21.1, 1.22)
# Latest 21.1.x at the time of writing; any 21.1.x should work.
# Check https://projects.neoforged.net/neoforged/neoforge for newer builds.
neo_version=21.1.176
neo_version_range=[21.1.0,)
loader_version_range=[4,)
# Create — только compileOnly для интеграции контрапшенов (рантайм опционален).
# Версии: https://maven.createmod.net/com/simibubi/create/create-1.21.1/
create_version=6.0.10-281

# Mod
mod_id=underlay
mod_name=Underlay
mod_license=MIT
mod_version=0.6.0
mod_group_id=dev.argorice.underlay
mod_authors=Argorice
mod_description=A decorative bottom layer for any block cell. Carpets continue under chests, snow sits under fences, floors stay whole.
